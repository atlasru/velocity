name: Velocity CI
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: velocity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Physics, protocol and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.414'
      - name: Validate workflow and packaging scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck="" .github/workflows/ci.yml
          python3 -m py_compile Tools/build_metadata.py Tools/package_build.py Tools/publish_release.py
      - name: Check Unity C# syntax
        run: dotnet run --project Tools/SyntaxCheck -c Release
      - name: Compile simulation for Unity's .NET Standard API surface
        run: dotnet build Tests/Compatibility -c Release
      - name: Run real physics, course and UDP tests
        run: dotnet run --project Tests/CoreHarness -c Release
      - name: Archive exact committed source
        if: always()
        run: |
          mkdir -p source-artifact
          git archive --format=zip --prefix=Velocity/ HEAD -o source-artifact/Velocity-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Velocity-source
          path: source-artifact/Velocity-source.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: velocity-core-test-results
          path: artifacts/core-tests.json
          if-no-files-found: warn
          retention-days: 30
  unity_tests:
    name: Unity EditMode and PlayMode tests
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Unity-6000.3.26f1-tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Unity-6000.3.26f1-tests-
      - name: Run Editor tests with GameCI
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2, classic Docker runner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.26f1
          testMode: all
          coverageOptions: 'assemblyFilters:+Velocity.*'
          artifactsPath: artifacts/unity-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Velocity-Unity-test-results
          path: artifacts/unity-tests
          if-no-files-found: warn
          retention-days: 30
  build:
    name: Unity ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [core, unity_tests]
    # Exports are still attempted if activation blocks Editor testing.
    # Publishing requires successful tests and both actual exports.
    if: ${{ always() && needs.core.result == 'success' && !cancelled() }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [StandaloneWindows64, Android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate version and release signing
        id: metadata
        env:
          VELOCITY_REF_TYPE: ${{ github.ref_type }}
          VELOCITY_REF_NAME: ${{ github.ref_name }}
          VELOCITY_TARGET: ${{ matrix.target }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 Tools/build_metadata.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Unity-6000.3.26f1-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Unity-6000.3.26f1-${{ matrix.target }}-
      - name: Build with GameCI
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.26f1
          targetPlatform: ${{ matrix.target }}
          buildMethod: Velocity.Editor.VelocityBuild.Build
          buildName: Velocity
          allowDirtyBuild: true
          versioning: None
          customParameters: -velocityVersion ${{ steps.metadata.outputs.version }}
          androidVersionCode: ${{ steps.metadata.outputs.code }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'velocity-signing.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify and package real exported files
        env:
          VELOCITY_VERSION: ${{ steps.metadata.outputs.version }}
        run: python3 Tools/package_build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Velocity-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Unity-logs-${{ matrix.target }}
          path: |
            build/**/*.log
            Logs/**
          if-no-files-found: warn
  release:
    name: Publish verified tagged binaries
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [core, unity_tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Velocity-*
          path: release
          merge-multiple: true
      - name: Publish Windows ZIP, ARM64 APK and source
        env:
          GH_TOKEN: ${{ github.token }}
          VELOCITY_TAG: ${{ github.ref_name }}
        run: python3 Tools/publish_release.py
