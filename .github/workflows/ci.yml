name: Velocity CI
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: velocity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Deterministic physics and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Tests/CoreHarness -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-core-test-results
          path: artifacts
  build:
    name: Unity ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: core
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [StandaloneWindows64, Android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Library
          key: Unity-6000.3.26f1-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Unity-6000.3.26f1-${{ matrix.target }}-
      - name: Build with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.26f1
          targetPlatform: ${{ matrix.target }}
          buildMethod: Velocity.Editor.VelocityBuild.Build
          buildName: Velocity
          allowDirtyBuild: true
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: Velocity-${{ matrix.target }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unity-logs-${{ matrix.target }}
          path: |
            build/**/*.log
            Logs/**
